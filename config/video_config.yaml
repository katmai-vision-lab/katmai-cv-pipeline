# Video Configuration
# Settings for frame extraction

# Directory containing raw videos
video_dir: data/raw_videos

# Default settings (applied to all videos unless overridden)
defaults:
  fps: 1.0        # Frames per second to extract
  format: jpg     # Output format: jpg or png
  quality: 95     # JPEG quality (1-100)

# Video-specific settings
videos:
  - name: "test_video_2025-09-19 23-30-11_Brooks_Falls_Low_really_0630PM _MDT_5_bears.mkv"
    start: 5        # Start at 5 seconds
    end: 89         # End at ~89 seconds (total 93.95s - 5s)
