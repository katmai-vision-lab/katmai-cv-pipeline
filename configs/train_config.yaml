# YOLOv8 Training Configuration
# 训练配置文件

# ============ 基础参数 ============
epochs: 5              # 训练轮数
batch: 16               # 批次大小
imgsz: 640              # 输入图像尺寸

# ============ 学习率参数 ============
lr0: 0.01               # 初始学习率
lrf: 0.01               # 最终学习率（相对于lr0）
momentum: 0.937         # SGD动量/Adam beta1
weight_decay: 0.0005    # 权重衰减

# ============ 数据增强参数 ============
# 色彩增强
hsv_h: 0.015            # 色调增强 (0.0-1.0)
hsv_s: 0.7              # 饱和度增强 (0.0-1.0)
hsv_v: 0.4              # 亮度增强 (0.0-1.0)

# 几何增强
degrees: 0.0            # 旋转角度 (+/- deg)
translate: 0.1          # 平移 (+/- fraction)
scale: 0.5              # 缩放增益 (+/- gain)
shear: 0.0              # 剪切角度 (+/- deg)
perspective: 0.0        # 透视变换 (0.0-0.001)
flipud: 0.0             # 上下翻转概率
fliplr: 0.5             # 左右翻转概率

# Mosaic/MixUp增强
mosaic: 1.0             # Mosaic增强概率
mixup: 0.0              # MixUp增强概率
copy_paste: 0.0         # Copy-paste增强概率

# ============ 其他参数 ============
patience: 50            # 早停耐心值（epochs）
save: true              # 保存checkpoint
save_period: -1         # 每N个epoch保存一次 (-1表示只保存最后)
workers: 8              # 数据加载器工作进程数
device: ''              # 设备 ('' 表示自动选择，0表示GPU0，cpu表示CPU)
verbose: true           # 显示详细输出
seed: 0                 # 随机种子
deterministic: true     # 确定性训练
optimizer: 'auto'       # 优化器 (SGD, Adam, Adamax, AdamW, NAdam, RAdam, RMSProp, auto)
pretrained: true        # 使用预训练权重
amp: true               # 自动混合精度训练
